name: PatiYuva GitHub Pages

on:
  push:
    branches:
      - ana

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: PatiYuva'yı derle
        run: npm run build

      - name: GitHub Pages dosyalarını hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
